<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Broadway Dental Boutique — Chatbot Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Top demo banner */
        .demo-banner {
            background: linear-gradient(90deg, #c9a84c, #e8d48b, #c9a84c);
            color: #1a1a1a;
            text-align: center;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
        }
        .demo-banner span { font-weight: 700; }

        /* Site screenshot background */
        .site-screenshot {
            margin-top: 38px;
            width: 100%;
            min-height: calc(100vh - 38px);
            background: #0a0a0a;
        }
        .site-screenshot img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ===== CHAT BUBBLE BUTTON ===== */
        .chat-bubble {
            position: fixed;
            bottom: 24px; right: 24px;
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #c9a84c, #e8d48b);
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(201, 168, 76, 0.4);
            z-index: 999;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
            animation: pulse-gold 2s infinite;
        }
        .chat-bubble:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 28px rgba(201, 168, 76, 0.6);
        }
        .chat-bubble svg { width: 28px; height: 28px; fill: #1a1a1a; }
        .chat-bubble.hidden { opacity: 0; pointer-events: none; transform: scale(0.5); }

        @keyframes pulse-gold {
            0%, 100% { box-shadow: 0 4px 20px rgba(201, 168, 76, 0.4); }
            50% { box-shadow: 0 4px 30px rgba(201, 168, 76, 0.7); }
        }

        /* ===== CHAT OVERLAY — TELEGRAM STYLE ===== */
        .chat-overlay {
            position: fixed;
            left: 0; right: 0;
            top: 0;
            height: 100vh;
            height: 100dvh;
            background: #0e1621;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
            overflow: hidden;
        }
        .chat-overlay.open {
            transform: translateY(0);
        }

        /* Desktop: constrain to window */
        @media (min-width: 481px) {
            .chat-overlay {
                left: auto;
                top: auto;
                right: 24px;
                bottom: 24px;
                width: 400px;
                height: 600px;
                max-height: calc(100vh - 48px);
                border-radius: 16px;
                transform: translateY(20px);
                opacity: 0;
                pointer-events: none;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
                box-shadow: 0 12px 48px rgba(0,0,0,0.6);
                border: 1px solid #1e2a3a;
            }
            .chat-overlay.open {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }
        }

        /* Header — Telegram style */
        .tg-header {
            display: flex;
            align-items: center;
            padding: 0 12px;
            height: 56px;
            background: #1a2736;
            border-bottom: 1px solid #0d1520;
            flex-shrink: 0;
        }
        .tg-back {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: none; background: none;
            color: #c9a84c; font-size: 22px;
            border-radius: 50%;
            transition: background 0.15s;
        }
        .tg-back:hover { background: rgba(255,255,255,0.05); }
        .tg-avatar {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #c9a84c, #e8d48b);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; margin-left: 4px; flex-shrink: 0;
        }
        .tg-header-text {
            margin-left: 12px; flex: 1;
        }
        .tg-header-name {
            font-size: 15px; font-weight: 600; color: #fff;
        }
        .tg-header-status {
            font-size: 12px; color: #6d8aab;
        }
        .tg-header-status.online { color: #4dd964; }

        /* Messages area */
        .tg-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #0e1621;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .tg-messages::-webkit-scrollbar { width: 6px; }
        .tg-messages::-webkit-scrollbar-thumb { background: #2b3e50; border-radius: 3px; }
        .tg-messages::-webkit-scrollbar-track { background: transparent; }

        /* Date separator */
        .tg-date-sep {
            text-align: center;
            padding: 8px 0;
        }
        .tg-date-sep span {
            background: #182533;
            color: #5a7a96;
            font-size: 12px; font-weight: 500;
            padding: 4px 12px;
            border-radius: 12px;
        }

        /* Message bubbles */
        .tg-msg {
            max-width: 85%;
            padding: 7px 10px 6px;
            font-size: 15px;
            line-height: 1.45;
            position: relative;
            word-wrap: break-word;
        }
        .tg-msg.bot {
            align-self: flex-start;
            background: #182533;
            color: #f5f5f5;
            border-radius: 12px 12px 12px 4px;
        }
        .tg-msg.user {
            align-self: flex-end;
            background: #2b5278;
            color: #f5f5f5;
            border-radius: 12px 12px 4px 12px;
        }
        .tg-msg .time {
            float: right;
            margin: 6px 0 -4px 12px;
            font-size: 11px;
            color: rgba(255,255,255,0.35);
        }
        .tg-msg.user .time { color: rgba(255,255,255,0.45); }

        /* Formatted text in bot messages */
        .tg-msg.bot strong {
            color: #e8d48b;
            font-weight: 600;
        }
        .tg-msg.bot em {
            color: #b8c4d0;
            font-style: italic;
        }
        .tg-msg.bot ul {
            margin: 4px 0;
            padding-left: 18px;
            list-style: none;
        }
        .tg-msg.bot li {
            margin: 3px 0;
            position: relative;
        }
        .tg-msg.bot li::before {
            content: '•';
            position: absolute;
            left: -14px;
            color: #c9a84c;
        }
        .tg-msg.bot a {
            color: #e8d48b;
            text-decoration: underline;
            text-underline-offset: 2px;
            -webkit-tap-highlight-color: rgba(232, 212, 139, 0.3);
            cursor: pointer;
            touch-action: manipulation;
        }
        .tg-msg.bot a:hover {
            color: #f0e0a0;
        }

        .tg-msg.typing {
            color: #6d8aab;
            font-style: italic;
        }
        .tg-msg.typing .typing-dots span {
            display: inline-block;
            animation: blink 1.4s infinite both;
        }
        .tg-msg.typing .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .tg-msg.typing .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        /* Quick replies — pill style */
        .tg-quick-replies {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 4px 12px 8px;
            flex-shrink: 0;
            background: #0e1621;
        }
        .tg-quick-btn {
            padding: 7px 14px;
            background: #1a2736;
            border: 1px solid #2b3e50;
            border-radius: 18px;
            color: #c9a84c;
            font-size: 13px; font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            font-family: inherit;
        }
        .tg-quick-btn:hover, .tg-quick-btn:active {
            background: #c9a84c;
            color: #1a1a1a;
            border-color: #c9a84c;
        }

        /* Input bar — Telegram style */
        .tg-input-bar {
            display: flex;
            align-items: flex-end;
            padding: 8px 10px;
            background: #1a2736;
            border-top: 1px solid #0d1520;
            flex-shrink: 0;
            gap: 8px;
        }
        .tg-input {
            flex: 1;
            background: #0e1621;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: #f5f5f5;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            max-height: 120px;
            resize: none;
            line-height: 1.4;
        }
        .tg-input::placeholder { color: #4a6478; }
        .tg-send {
            width: 40px; height: 40px;
            background: none; border: none;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            color: #6d8aab;
            transition: color 0.15s;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .tg-send.active { color: #c9a84c; }
        .tg-send:hover { background: rgba(255,255,255,0.05); }
        .tg-send svg { width: 22px; height: 22px; }

        /* Safe area for notched phones */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .tg-input-bar { padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>

    <!-- Demo Banner -->
    <div class="demo-banner">
        ✨ <span>DEMO</span> — Live chatbot demo for Broadway Dental Boutique by <span>Cloud Hak</span> ✨
    </div>

    <!-- Site Screenshot -->
    <div class="site-screenshot">
        <img src="site-screenshot.png" alt="Broadway Dental Boutique website">
    </div>

    <!-- Chat Bubble -->
    <div class="chat-bubble" id="chatBubble" onclick="toggleChat()">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
    </div>

    <!-- Telegram-style Chat Overlay -->
    <div class="chat-overlay" id="chatOverlay">
        <div class="tg-header">
            <button class="tg-back" onclick="toggleChat()">←</button>
            <div class="tg-avatar">🦷</div>
            <div class="tg-header-text">
                <div class="tg-header-name">Broadway Dental</div>
                <div class="tg-header-status online">online</div>
            </div>
        </div>
        <div class="tg-messages" id="chatMessages">
            <div class="tg-date-sep"><span>Today</span></div>
            <div class="tg-msg bot">
                Welcome to Broadway Dental Boutique! 👋<span class="time">now</span>
                <br>How can I help you today?
            </div>
        </div>
        <div class="tg-quick-replies" id="quickReplies">
            <button class="tg-quick-btn" onclick="sendQuickReply(this)">Tell me about Invisalign</button>
            <button class="tg-quick-btn" onclick="sendQuickReply(this)">Nervous patient</button>
            <button class="tg-quick-btn" onclick="sendQuickReply(this)">Book appointment</button>
            <button class="tg-quick-btn" onclick="sendQuickReply(this)">Teeth whitening</button>
        </div>
        <div class="tg-input-bar">
            <input class="tg-input" id="chatInput" placeholder="Message..." onkeypress="if(event.key==='Enter')sendMessage()" oninput="updateSendBtn()">
            <button class="tg-send" id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://broadway-dental-chatbot.airwayclinicproxy.workers.dev';
        let chatOpen = false;
        let messages = [];

        // ===== KEYBOARD HANDLING =====
        // iOS Chrome doesn't resize the viewport when keyboard opens — it scrolls the page.
        // We pin the chat overlay to the visualViewport (visible area) instead.
        // Only set up on mobile devices.
        function setupKeyboardHandling() {
            // Skip entirely on desktop
            if (window.innerWidth > 480) return;
            
            const overlay = document.getElementById('chatOverlay');
            const msgs = document.getElementById('chatMessages');
            const input = document.getElementById('chatInput');

            function adjustToViewport() {
                if (!chatOpen) return;
                const vv = window.visualViewport;
                if (!vv) return;

                // Pin overlay to the visible area (above keyboard)
                overlay.style.position = 'fixed';
                overlay.style.top = vv.offsetTop + 'px';
                overlay.style.left = '0';
                overlay.style.right = '0';
                overlay.style.height = vv.height + 'px';

                // Keep messages scrolled to bottom
                requestAnimationFrame(() => {
                    msgs.scrollTop = msgs.scrollHeight;
                });
            }

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', adjustToViewport);
                window.visualViewport.addEventListener('scroll', adjustToViewport);
            }

            input.addEventListener('focus', () => {
                document.body.style.overflow = 'hidden';
                document.body.style.position = 'fixed';
                document.body.style.width = '100%';
                setTimeout(adjustToViewport, 50);
                setTimeout(adjustToViewport, 150);
                setTimeout(adjustToViewport, 300);
                setTimeout(adjustToViewport, 500);
            });

            input.addEventListener('blur', () => {
                document.body.style.overflow = '';
                document.body.style.position = '';
                document.body.style.width = '';
                setTimeout(() => {
                    if (!chatOpen) return;
                    const vv = window.visualViewport;
                    if (vv) {
                        overlay.style.top = vv.offsetTop + 'px';
                        overlay.style.height = vv.height + 'px';
                    }
                }, 100);
            });
        }

        setupKeyboardHandling();

        function toggleChat() {
            chatOpen = !chatOpen;
            const overlay = document.getElementById('chatOverlay');
            const bubble = document.getElementById('chatBubble');
            
            if (chatOpen) {
                overlay.classList.add('open');
                bubble.classList.add('hidden');
                if (window.innerWidth <= 480) {
                    setTimeout(() => document.getElementById('chatInput').focus(), 350);
                }
            } else {
                overlay.classList.remove('open');
                bubble.classList.remove('hidden');
                overlay.style.opacity = '';
                overlay.style.transform = '';
                overlay.style.height = '';
                overlay.style.top = '';
            }
        }

        function getTime() {
            const d = new Date();
            return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }

        // Simple markdown to HTML parser
        function parseMarkdown(text) {
            return text
                // Links: [text](url)
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
                // Bold: **text**
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                // Italic: *text*
                .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>')
                // Bullet points: lines starting with - or *
                .replace(/^[\-\*]\s+(.+)$/gm, '<li>$1</li>')
                // Wrap consecutive <li> in <ul> — add spacing above, remove inner newlines
                .replace(/(<li>[\s\S]*?<\/li>(\n|<br>)?)+/g, (match) => '<br><ul>' + match.replace(/\n/g, '').replace(/<br>/g, '') + '</ul>')
                // Line breaks (double newline = paragraph)
                .replace(/\n\n/g, '<br><br>')
                // Single newline
                .replace(/\n/g, '<br>');
        }

        function addMessage(text, type) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'tg-msg ' + type;
            const time = '<span class="time">' + getTime() + '</span>';
            const formatted = type === 'bot' ? parseMarkdown(text) : text;
            div.innerHTML = formatted + time;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping() {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'tg-msg bot typing';
            div.id = 'typingIndicator';
            div.innerHTML = '<span class="typing-dots"><span>●</span> <span>●</span> <span>●</span></span>';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function updateSendBtn() {
            const input = document.getElementById('chatInput');
            const btn = document.getElementById('sendBtn');
            btn.classList.toggle('active', input.value.trim().length > 0);
        }

        async function sendMessage(text) {
            const input = document.getElementById('chatInput');
            const msg = text || input.value.trim();
            if (!msg) return;
            input.value = '';
            updateSendBtn();

            // Hide quick replies after first message
            document.getElementById('quickReplies').style.display = 'none';

            addMessage(msg, 'user');
            messages.push({ role: 'user', content: msg });

            showTyping();

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages })
                });
                const data = await res.json();
                const reply = data.response || "I'm sorry, I couldn't process that. Please call us on 01293 428342.";
                hideTyping();
                addMessage(reply, 'bot');
                messages.push({ role: 'assistant', content: reply });
            } catch (err) {
                hideTyping();
                addMessage("I'm having trouble connecting. Please call us on 01293 428342.", 'bot');
            }
        }

        function sendQuickReply(btn) {
            sendMessage(btn.textContent);
        }
    </script>
</body>
</html>
